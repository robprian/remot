name: Remot Build

# The ONLY authoritative production Android build. Runs on pushes to `main`
# using a GitHub-hosted runner, produces exactly one signed release APK, and
# uploads it as the `remot-release-apk` artifact. It NEVER creates a release —
# that is the Release workflow's job. Tag pushes deliberately do not trigger
# this, so a tag created by the Release workflow cannot start another build
# (prevents a Build→Release→Build loop).
on:
  push:
    branches: [ main ]

permissions:
  contents: read

# One canonical build at a time; superseded runs on the same ref are cancelled
# to save Actions minutes.
concurrency:
  group: remot-build
  cancel-in-progress: true

jobs:
  build:
    name: Test + lint + signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Provision production signing keystore
        working-directory: android/app
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing — cannot sign a production release APK."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          echo "keystore provisioned ($(wc -c < release.keystore) bytes)"

      - name: Test, lint + assemble signed release
        working-directory: android
        env:
          SIGNALING_URL: ${{ secrets.SIGNALING_URL }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_URL_ALT: ${{ secrets.SERVER_URL_ALT }}
          SERVER_IP_ALT: ${{ secrets.SERVER_IP_ALT }}
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNALING_URL" ] && [ -z "$SERVER_URL" ]; then
            echo "::error::SIGNALING_URL (or SERVER_URL) secret is missing."
            exit 1
          fi
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Validate release APK (identity, version, signature)
        working-directory: android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          [ -s "$APK" ] || { echo "::error::release APK missing or empty ($APK)"; exit 1; }
          AAPT2="$(ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/aapt2 2>/dev/null | head -1)"
          [ -n "$AAPT2" ] || { echo "::error::aapt2 not found"; exit 1; }
          BADGING="$("$AAPT2" dump badging "$APK")"
          echo "$BADGING" | grep -E "package: |sdkVersion|targetSdkVersion" | sed 's/^/  /'
          echo "$BADGING" | grep -q "package: name='com.robrion.remot'" \
            || { echo "::error::applicationId is not com.robrion.remot"; exit 1; }
          echo "applicationId OK: com.robrion.remot"
          APKSIGNER="$(ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | head -1)"
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner not found"; exit 1; }
          echo "--- apksigner verify ---"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | grep -E "Verified using|Signer #|SHA-256 digest|certificate DN" | sed 's/^/   /'
          "$APKSIGNER" verify "$APK" || { echo "::error::APK signature verification failed"; exit 1; }
          echo "APK signature verified."

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: remot-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload debug APK artifact (dev builds)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

  # External reachability probe for the production server, run from GitHub's
  # public network on every build. Advisory (continue-on-error): STUN/TURN may
  # be blocked at the cloud firewall until the security group is opened, and
  # that must NOT block Android releases. The probe only fails when the
  # signaling WebSocket itself is unreachable.
  network-probe:
    name: External endpoint probe (production server)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SERVER_URL: ${{ secrets.SERVER_URL }}
      SERVER_IP: ${{ secrets.SERVER_IP }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe signaling / STUN / TURN from this (external) network
        run: node scripts/probe-endpoints.mjs