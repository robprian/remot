name: Remot Release

# Release ONLY — triggered by V/C/P production tags (v1c001, v1c001p01, ...).
# Does not run on branch pushes or pull requests; validation lives in ci.yml,
# so a tag push executes exactly one workflow run (this one).
# Version scheme: docs/VERSIONING.md.
on:
  push:
    tags:
      - 'v[0-9]c[0-9][0-9][0-9]'
      - 'v[0-9]c[0-9][0-9][0-9]p[0-9][0-9]'

# Smallest scope needed to create a GitHub Release and attach APKs.
permissions:
  contents: write

# Never allow two identical release jobs to race on the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build APK + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Provision release keystore (if secrets configured)
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            echo "keystore provided"
          else
            echo "no keystore secret — release APK will be unsigned"
          fi

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ARGS=()
          if [ -f release.keystore ]; then
            ARGS+=(-PkeystorePath=release.keystore -PkeystorePassword="$KEYSTORE_PASSWORD" -PkeyAlias="$KEY_ALIAS" -PkeyPassword="$KEY_PASSWORD")
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace "${ARGS[@]}"

      - name: Name release APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "remot-${GITHUB_REF_NAME}.apk" 2>/dev/null \
            || cp android/app/build/outputs/apk/release/app-release-unsigned.apk "remot-${GITHUB_REF_NAME}.apk"

      - name: Verify APK metadata matches tag
        run: |
          # Tag v1c001p37 → versionName V1C001P37, versionCode 100137
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$TAG" =~ ^([0-9])c([0-9]{3})(p([0-9]{2}))?$ ]]; then
            V="${BASH_REMATCH[1]}"
            C=$((10#${BASH_REMATCH[2]}))
            P=$((10#${BASH_REMATCH[4]:-0}))
            EXPECTED_CODE=$((V * 100000 + C * 100 + P))
            EXPECTED_NAME="V${V}C$(printf '%03d' "$C")"
            if [ -n "${BASH_REMATCH[4]}" ]; then
              EXPECTED_NAME="${EXPECTED_NAME}P$(printf '%02d' "$P")"
            fi
          else
            echo "::error::unexpected tag format ${GITHUB_REF_NAME}"
            exit 1
          fi
          AAPT2="$(ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/aapt2 2>/dev/null | head -1)"
          [ -n "$AAPT2" ] || { echo "::error::aapt2 not found"; exit 1; }
          BADGING="$("$AAPT2" dump badging "remot-${GITHUB_REF_NAME}.apk")"
          echo "$BADGING" | grep -E "package:" | sed 's/^/  /'
          echo "$BADGING" | grep -q "versionName='$EXPECTED_NAME'" \
            || { echo "::error::versionName mismatch (expected $EXPECTED_NAME)"; exit 1; }
          echo "$BADGING" | grep -q "versionCode='$EXPECTED_CODE'" \
            || { echo "::error::versionCode mismatch (expected $EXPECTED_CODE)"; exit 1; }
          echo "APK metadata OK: $EXPECTED_NAME (versionCode $EXPECTED_CODE)"

      - name: Compute release name
        id: meta
        run: echo "release_name=Remot ${GITHUB_REF_NAME^^}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          name: ${{ steps.meta.outputs.release_name }}
          body: |
            Remot production release **${{ steps.meta.outputs.release_name }}** — V/C/P versioning, see `docs/VERSIONING.md`.
          files: remot-v*.apk
          fail_on_unmatched_files: false
