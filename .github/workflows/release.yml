name: Remot Release

# Rolling production release. Runs AFTER a successful Remot Build workflow
# (`workflow_run`), downloads the EXACT artifact that build produced, reads the
# version from the APK, and publishes it:
#
#   * New version  -> create tag + release, attach the APK.
#   * Same version -> force-move the existing tag to the newest build commit,
#                     update the existing release, and replace the APK asset.
#
# It NEVER runs Gradle / builds an APK. It creates/moves tags via the git refs
# API only, so it cannot recursively trigger the Build workflow (Build only
# responds to branch pushes on `main`), which keeps the pipeline acyclic.
on:
  workflow_run:
    workflows: [ "Remot Build" ]
    types: [ completed ]

permissions:
  contents: write
  actions: read

# One production release at a time; never cancel a running release.
concurrency:
  group: remot-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish / update GitHub Release from the Build artifact
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Install Android build-tools for APK validation
        uses: android-actions/setup-android@v3

      - name: Install required build-tools
        run: sdkmanager "build-tools;34.0.0"

      - uses: actions/checkout@v4

      - name: Download exact build artifact
        uses: actions/download-artifact@v4
        with:
          name: remot-release-apk
          path: artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Detect version + validate artifact
        id: meta
        run: |
          set -euo pipefail
          APK=$(find artifact -name '*.apk' | head -1)
          [ -s "$APK" ] || { echo "::error::no release APK in artifact"; exit 1; }
          AAPT2=$(ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/aapt2 | head -1)
          BADGING=$("$AAPT2" dump badging "$APK")
          PKG=$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          VER=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          VERCODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          [ -n "$PKG" ] && [ "$PKG" = "com.robrion.remot" ] || { echo "::error::applicationId mismatch: '$PKG'"; exit 1; }
          if [[ ! "$VER" =~ ^V[0-9]C[0-9]{3}(P[0-9]{2})?$ ]]; then
            echo "::error::unrecognized versionName: '$VER'"; exit 1
          fi
          APKSIGNER=$(ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/apksigner | head -1)
          "$APKSIGNER" verify "$APK" || { echo "::error::APK signature invalid"; exit 1; }
          TAG="${VER,,}"
          cp "$APK" "$GITHUB_WORKSPACE/remot-${VER}.apk"
          echo "version=$VER" >> "$GITHUB_ENV"
          echo "version_code=$VERCODE" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_ENV"
          echo "apk_name=remot-${VER}.apk" >> "$GITHUB_ENV"
          echo "commit=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          echo "build_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          # Is this version already released (rolling update) or brand new?
          EXIST=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")
          if [ "$EXIST" = "200" ]; then echo "existing_release=true" >> "$GITHUB_ENV"; else echo "existing_release=false" >> "$GITHUB_ENV"; fi

      - name: Verify CHANGELOG matches version
        run: |
          set -euo pipefail
          TOP=$(grep -m1 '^## ' CHANGELOG.md || true)
          if [[ "$TOP" != "## $version"* ]]; then
            echo "::error::CHANGELOG top entry is '$TOP' but APK version is '$version'"; exit 1
          fi

      - name: Set tag to build commit (create or force-move)
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${{ github.token }}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "$AUTH" \
            "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/${tag}")
          if [ "$CODE" = "200" ]; then
            HTTP=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH -H "$AUTH" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"sha\":\"$commit\",\"force\":true}" \
              "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/${tag}")
            [ "$HTTP" = "200" ] || { echo "::error::could not update tag ${tag} (HTTP $HTTP)"; exit 1; }
            echo "Tag ${tag} -> $commit (updated)"
          else
            HTTP=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "$AUTH" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"ref\":\"refs/tags/${tag}\",\"sha\":\"$commit\"}" \
              "https://api.github.com/repos/${{ github.repository }}/git/refs")
            [ "$HTTP" = "201" ] || { echo "::error::could not create tag ${tag} (HTTP $HTTP)"; exit 1; }
            echo "Tag ${tag} -> $commit (created)"
          fi

      - name: Compose release notes
        run: |
          cat > /tmp/notes.md <<EOF
          # Remot $version

          Version: $version
          Commit: $commit
          Build: $build_id

          Production APK built and validated by the Remot Build workflow (GitHub-hosted runner).

          ## APK

          \`$apk_name\`

          ## Changelog

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          EOF

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$existing_release" = "true" ]; then
            echo "Updating existing release $version (#$build_id, $commit)"
            gh release edit "$tag" --title "Remot $version" --notes-file /tmp/notes.md
            gh release upload "$tag" "$GITHUB_WORKSPACE/$apk_name" --clobber
          else
            echo "Creating new release $version (#$build_id, $commit)"
            gh release create "$tag" "$GITHUB_WORKSPACE/$apk_name" \
              --title "Remot $version" --notes-file /tmp/notes.md
          fi