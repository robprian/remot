name: Remot Release

# Release ONLY — triggered by semantic version tags (v1.0.0, v1.0.1, ...).
# Does not run on branch pushes or pull requests; validation lives in ci.yml,
# so a tag push executes exactly one workflow run (this one).
on:
  push:
    tags:
      - 'v*.*.*'

# Smallest scope needed to create a GitHub Release and attach APKs.
permissions:
  contents: write

# Never allow two identical release jobs to race on the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build APK + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Provision release keystore (if secrets configured)
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            echo "keystore provided"
          else
            echo "no keystore secret — release APK will be unsigned"
          fi

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ARGS=()
          if [ -f release.keystore ]; then
            ARGS+=(-PkeystorePath=release.keystore -PkeystorePassword="$KEYSTORE_PASSWORD" -PkeyAlias="$KEY_ALIAS" -PkeyPassword="$KEY_PASSWORD")
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace "${ARGS[@]}"

      - name: Name release APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "remot-v${VERSION}.apk" 2>/dev/null \
            || cp android/app/build/outputs/apk/release/app-release-unsigned.apk "remot-v${VERSION}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          files: remot-v*.apk
          fail_on_unmatched_files: false
