name: Remot Release

# Release workflow — the ONLY trigger is a successful Remot Build workflow
# (workflow_run). It runs for every Build completion but ONLY acts on V/C/P
# production tags on main: it downloads the EXACT APK artifact produced by that
# build, re-validates it, and publishes the GitHub Release. It never rebuilds
# the APK and never runs on `push` directly, giving exactly one release path.
# Non-tag completions (main pushes, PRs) skip cleanly; failed builds never
# reach Release.
on:
  workflow_run:
    workflows: [ "Remot Build" ]
    types:
      - completed

permissions:
  contents: write
  actions: read

# Only one production release at a time; never cancel a running release.
concurrency:
  group: remot-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release from verified build artifact
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      # Resolve the ref into version metadata. A non-production-tag push (main,
      # branch) yields an empty version and the rest of the job skips cleanly.
      - name: Extract version metadata (skips non-tag pushes)
        id: meta
        env:
          REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          REF="${REF#refs/tags/}"
          if [[ "$REF" =~ ^v([0-9])c([0-9]{3})(p([0-9]{2}))?$ ]]; then
            V="${BASH_REMATCH[1]}"; C=$((10#${BASH_REMATCH[2]})); P=$((10#${BASH_REMATCH[4]:-0}))
            CODE=$(( V * 100000 + C * 100 + P ))
            NAME="V${V}C$(printf '%03d' "$C")"
            [[ -n "${BASH_REMATCH[4]}" ]] && NAME="${NAME}P$(printf '%02d' "$P")"
            echo "version_name=$NAME" >> "$GITHUB_ENV"
            echo "version_code=$CODE" >> "$GITHUB_ENV"
            echo "apk_name=remot-$REF.apk" >> "$GITHUB_ENV"
            echo "release_title=Remot $NAME" >> "$GITHUB_ENV"
            echo "release_tag=$REF" >> "$GITHUB_ENV"
          else
            echo "Ref '$REF' is not a V/C/P production tag — skipping release."
          fi

      - name: Download exact build artifact
        if: env.release_tag != ''
        uses: actions/download-artifact@v4
        with:
          name: remot-release-apk
          path: release-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate artifact before release
        if: env.release_tag != ''
        run: |
          APK=$(find release-artifact -name '*.apk' | head -1)
          [ -s "$APK" ] || { echo "::error::no APK in artifact"; exit 1; }
          echo "artifact: $APK ($(wc -c < "$APK") bytes)"
          [[ "$APK" == *split_config* ]] && { echo "::error::split APK — refusing to release"; exit 1; }
          file "$APK" | grep -qi "zip\|android" || { echo "::error::not a valid APK/ZIP"; exit 1; }
          AAPT2="$(ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/aapt2 2>/dev/null | head -1)"
          BADGING="$("$AAPT2" dump badging "$APK")"
          echo "$BADGING" | grep "package:" | sed 's/^/  /'
          echo "$BADGING" | grep -q "package: name='com.robrion.remot'" || { echo "::error::applicationId mismatch"; exit 1; }
          echo "$BADGING" | grep -q "versionName='${{ env.version_name }}'" || { echo "::error::versionName mismatch (expected ${{ env.version_name }})"; exit 1; }
          echo "$BADGING" | grep -q "versionCode='${{ env.version_code }}'" || { echo "::error::versionCode mismatch (expected ${{ env.version_code }})"; exit 1; }
          APKSIGNER="$(ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | head -1)"
          "$APKSIGNER" verify "$APK" || { echo "::error::APK signature verification failed"; exit 1; }
          cp "$APK" "$GITHUB_WORKSPACE/${{ env.apk_name }}"
          echo "artifact validation PASSED (${{ env.apk_name }})"

      - name: Create GitHub Release
        if: env.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ env.release_tag }}
          name: ${{ env.release_title }}
          body: |
            Remot production release **${{ env.release_title }}**.

            Built and validated by the **Remot Build** workflow from this exact
            commit; no rebuild at release time. V/C/P versioning, see `docs/VERSIONING.md`.
          files: ${{ env.apk_name }}
          draft: false
          prerelease: false