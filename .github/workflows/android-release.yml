name: Remot CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same ref. No matrix builds: one canonical
# environment keeps Actions usage low.
concurrency:
  group: remot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Signaling server (smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Protocol smoke test
        run: npm run smoke

  android:
    name: Android (build + unit tests + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      # gradlew may lose its exec bit when committed from Windows.
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build, unit test, lint
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: remot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore

  release:
    name: Release APK + GitHub Release (version tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ server, android ]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Provision release keystore (if secrets configured)
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            echo "keystore provided"
          else
            echo "no keystore secret — release APK will be unsigned"
          fi

      - name: Build release + debug APKs
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ARGS=()
          if [ -f release.keystore ]; then
            ARGS+=(-PkeystorePath=release.keystore -PkeystorePassword="$KEYSTORE_PASSWORD" -PkeyAlias="$KEY_ALIAS" -PkeyPassword="$KEY_PASSWORD")
          fi
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace "${ARGS[@]}"

      - name: Name APKs for the release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "remot-v${VERSION}.apk" 2>/dev/null \
            || cp android/app/build/outputs/apk/release/app-release-unsigned.apk "remot-v${VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "remot-v${VERSION}-debug.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            remot-v*.apk
          fail_on_unmatched_files: false
